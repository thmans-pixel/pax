packaging_format = 2

id = "pax"
name = "Pax"
description.en = "Turn-based world management game driven by Ollama (Pax Historia-style)"
description.fr = "Jeu de gestion du monde au tour par tour, propulsé par Ollama (façon Pax Historia)"

version = "0.1.0~ynh1"

maintainers = ["thmans-pixel"]

[upstream]
license = "free"
code = "https://github.com/thmans-pixel/pax"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = true
sso = true
disk = "100M"
ram.build = "200M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/pax"

    [install.init_main_permission]
    type = "group"
    default = "admins"

    [install.admin]
    type = "user"

    [install.ollama_url]
    ask.en = "Address of the Ollama server (the gaming PC)"
    ask.fr = "Adresse de l'Ollama du PC (ex. http://192.168.1.20:11434)"
    type = "string"
    default = "http://localhost:11434"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "python3, python3-venv, python3-pip"
