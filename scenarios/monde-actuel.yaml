# Monde actuel — départ le 22 novembre 2026.
#
# Faits vérifiés dans la presse du 10 au 22 novembre 2026 (Al Jazeera, Reuters, AP, PRIO,
# gov.uk, Japan Kantei, CFR) : guerre en Ukraine et pourparlers d'Abou Dhabi, Gaza, guerre
# contre l'Iran, Venezuela, Royaume-Uni (Burnham), Japon (Takaichi), France, Allemagne,
# élections au Brésil et en Israël. Le reste vient de connaissances antérieures à juin 2026.
# À RELIRE par Thibault avant de s'y fier.

id: monde-actuel
nom: Monde actuel
date_depart: 2026-11-22
description: >
  Le monde à la fin novembre 2026 : une guerre en Ukraine qui entre dans sa cinquième année,
  un cessez-le-feu à Gaza qui se défait, un affrontement ouvert entre l'Iran et les
  États-Unis, une Europe qui cherche sa place dans les négociations, et une trêve
  commerciale fragile entre Washington et Pékin.

contexte: |
  Situation au 22 novembre 2026.
  UKRAINE : la guerre dure depuis février 2022 (plus de 4 ans et demi). Des pourparlers
  tripartites États-Unis / Ukraine / Russie ont repris à Abou Dhabi les 10 et 11 novembre
  après neuf mois d'interruption : échange de prisonniers, aucune percée. Witkoff et Kushner
  ont ensuite vu Poutine à Moscou puis Zelensky à Dublin. Moscou refuse la présence des
  Européens aux négociations et toute troupe européenne en Ukraine après un cessez-le-feu ;
  le front de 1 200 km reste actif, avec des frappes sur Kiev. Le Donbass est le point dur.
  GAZA : le cessez-le-feu d'octobre 2025 (plan en 20 points de Trump, Conseil de la paix)
  est à bout de souffle. Israël tient environ 53 % du territoire derrière la « ligne jaune »
  et a lancé le 18 novembre sa première offensive terrestre depuis la trêve, au centre de
  Gaza. Le Conseil de la paix met en garde contre un effondrement imminent et doit présenter
  son rapport à New York fin novembre.
  ISRAËL : élections le 27 octobre 2026 ; le bloc de Netanyahou a 53 sièges, l'opposition de
  Gadi Eisenkot 48, les partis arabes 19 : personne n'a la majorité (61). Netanyahou est
  Premier ministre sortant ; la formation du gouvernement est en cours.
  IRAN : les États-Unis et Israël ont attaqué l'Iran le 28 février 2026 (le guide Ali
  Khamenei a été tué), après la guerre de douze jours de juin 2025. Mojtaba Khamenei lui a
  succédé en mars. Un cessez-le-feu fragile tient mal : le détroit d'Ormuz est perturbé,
  des navires sont attaqués, les États-Unis ont frappé des installations dans le sud de
  l'Iran et l'Iran a visé des bases à Bahreïn et au Koweït (mi-novembre). Des négociations
  nucléaires passent par le Qatar ; Trump envisage de nouvelles frappes.
  ÉTATS-UNIS : Donald Trump est président, JD Vance vice-président. Les républicains ont subi
  des pertes aux élections de mi-mandat du 3 novembre ; le nouveau Congrès entre en fonction
  le 3 janvier 2027. Trêve commerciale avec la Chine depuis le sommet de Busan (octobre
  2025), sous tension (Taïwan, excédent commercial record de la Chine, contrôle des
  exportations d'IA).
  VENEZUELA : Nicolás Maduro a été capturé par les États-Unis en janvier 2026 et est détenu à
  New York. Delcy Rodríguez gouverne comme présidente par intérim ; Washington contrôle les
  ventes de pétrole et parraine des pourparlers avec l'opposition (María Corina Machado).
  EUROPE : Royaume-Uni, Andy Burnham Premier ministre depuis le 20 juillet 2026 (Starmer a
  démissionné). France, Emmanuel Macron président jusqu'en 2027, Sébastien Lecornu Premier
  ministre, présidentielle en avril 2027. Allemagne, Friedrich Merz très affaibli par des
  défaites régionales en septembre, coalition CDU-SPD. Les Européens réclament une place dans
  les négociations sur l'Ukraine.
  ASIE : Japon, Sanae Takaichi Première ministre après une victoire écrasante aux législatives.
  BRÉSIL : Lula a été réélu le 25 octobre 2026 (51,8 %) ; Flávio Bolsonaro conteste le résultat.

chiffres_defaut: {economie: 25, armee: 22, stabilite: 50, influence: 12}

ecarts:
  - "Dirigeants confirmés par la presse de novembre 2026 : Trump, Poutine, Zelensky, Burnham, Macron/Lecornu, Merz, Takaichi, Netanyahou (sortant), Mojtaba Khamenei, Lula, Delcy Rodríguez."
  - "Dirigeants NON revérifiés (mandats en cours d'après mes connaissances de juin 2026) : Xi Jinping, Modi, Meloni, Sánchez, Tusk, Erdoğan, Mohammed ben Salmane, al-Sissi, Shehbaz Sharif, Lee Jae-myung, Kim Jong Un, Lai Ching-te, Sheinbaum, Milei, Carney, Albanese, Ramaphosa, Tinubu, Prabowo, Abbas."
  - "Les territoires sont les pays actuels : la Crimée et les zones occupées du Donbass restent à l'Ukraine sur la carte ; l'occupation est portée par la guerre et par les règles."
  - "Gaza et la Cisjordanie sont un seul territoire (Palestine) sur le fond de carte ; le Sahara occidental, le Somaliland et Chypre-Nord apparaissent comme territoires distincts."
  - "Non vérifiés non plus : la candidature de Zemmour et le renoncement de Macron cités dans les règles, et Mette Frederiksen au Danemark."
  - "Les chiffres (économie, armée, stabilité, influence) sont des estimations de jeu, pas des mesures."

