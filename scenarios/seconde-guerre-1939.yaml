# Seconde Guerre mondiale — 1er septembre 1939 (l'Allemagne envahit la Pologne).
#
# Les territoires sont les pays actuels ; ce fichier réaffecte ceux dont le propriétaire
# de 1939 diffère (empires coloniaux, annexions de l'Axe, URSS, Yougoslavie). Les pays
# indépendants en 1939 avec des frontières proches des actuelles ne sont pas listés : ils
# restent des nations mineures sous leur nom moderne (voir `ecarts`).
# Les événements à venir (17 septembre, 1940…) sont dans `regles`, pas sur la carte.

id: seconde-guerre-1939
nom: Seconde Guerre mondiale
date_depart: 1939-09-01
description: >
  L'aube du 1er septembre 1939 : la Wehrmacht franchit la frontière polonaise. L'Axe est
  conquérant, les empires coloniaux couvrent le globe, l'Union soviétique vient de signer un
  pacte avec Berlin et les États-Unis restent neutres. Menez une puissance à travers le plus
  grand conflit de l'Histoire.

contexte: |
  Au matin du 1er septembre 1939, l'Allemagne nazie attaque la Pologne sans déclaration de
  guerre. Le Royaume-Uni (garantie du 31 mars 1939, traité d'assistance du 25 août) et la
  France se sont engagés à défendre la Pologne ; leurs ultimatums à Berlin n'ont pas encore
  été formulés. Le pacte germano-soviétique du 23 août contient un protocole secret qui
  partage l'Europe de l'Est entre Berlin et Moscou. L'Italie est liée à l'Allemagne par le
  Pacte d'acier (mai 1939) mais n'est pas prête à la guerre. Le Japon est enlisé en Chine
  depuis 1937 et vient de subir une défaite face aux Soviétiques à Khalkhin Gol. Les
  États-Unis, isolationnistes, sont tenus par leurs lois de neutralité. La guerre civile
  espagnole s'est terminée en avril : Franco est vainqueur. La technologie est celle de
  l'époque : chars, aviation, sous-marins, radio ; pas d'arme nucléaire ni de radar généralisé.
  Les puissances coloniales fondent leurs forces sur leurs empires.

chiffres_defaut: {economie: 20, armee: 18, stabilite: 50, influence: 10}

ecarts:
  - "Les contours sont ceux d'aujourd'hui. L'ouest de l'Ukraine et de la Biélorussie (polonais en 1939) figure dans l'URSS ; la Pologne actuelle comprend la Silésie et la Poméranie, allemandes en 1939 ; Kaliningrad (Prusse-Orientale allemande) figure dans l'URSS."
  - "Les pays baltes (Estonie, Lettonie, Lituanie) et la Finlande sont indépendants en 1939 ; leur annexion ou leur guerre avec l'URSS est décrite dans les règles. La Moldavie est roumaine (Bessarabie)."
  - "La Slovaquie est un État indépendant client du Reich, qui participe à l'invasion de la Pologne ; la Hongrie, la Bulgarie, l'Égypte, l'Irak, l'Iran, la Turquie, la Thaïlande (Siam), l'Éthiopie (italienne), etc. sont des nations mineures."
  - "La Mandchourie, occupée par le Japon, n'est pas découpée : la Chine garde la totalité de son territoire actuel, et le Japon est en guerre contre elle."
  - "Les Dominions (Canada, Australie, Nouvelle-Zélande, Afrique du Sud) sont des nations distinctes, liées au Royaume-Uni et pas encore en guerre le 1er septembre."
  - "Le Danemark possède le Groenland ; l'Islande, en union personnelle avec lui, reste une nation mineure."
  - "Les chiffres sont des estimations de jeu, pas des mesures."

