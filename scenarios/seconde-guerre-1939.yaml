regles:
  - date: 1939-09-03
    texte: >
      Dans l'histoire réelle, le Royaume-Uni puis la France déclarent la guerre à l'Allemagne
      le 3 septembre, faute de retrait de ses troupes de Pologne ; les Dominions suivent dans
      les jours qui suivent (Australie et Nouvelle-Zélande le 3, Canada le 10, Afrique du Sud
      le 6 après la chute du gouvernement Hertzog).
  - date: 1939-09-15
    texte: >
      L'armistice de Khalkhin Gol (15-16 septembre) met fin aux combats entre l'URSS et le
      Japon : le Japon se tourne vers le sud.
  - date: 1939-09-17
    texte: >
      Conformément au protocole secret du pacte germano-soviétique, l'URSS envahit l'est de
      la Pologne ; le partage est confirmé le 28 septembre. Cela dépend de la solidité du
      pacte et de la situation militaire polonaise.
  - date: 1939-11-30
    texte: >
      L'URSS attaque la Finlande (guerre d'Hiver) après son refus de céder des territoires.
  - date: 1940-04-09
    texte: >
      L'Allemagne envahit le Danemark et la Norvège pour sécuriser le minerai suédois et ses
      routes navales.
  - date: 1940-05-10
    texte: >
      Offensive allemande à l'Ouest : Pays-Bas, Belgique, Luxembourg puis France ; l'Italie
      entre en guerre le 10 juin ; l'armistice franco-allemand est signé le 22 juin.
  - date: 1940-06-15
    texte: >
      L'URSS occupe puis annexe l'Estonie, la Lettonie et la Lituanie, et prend la Bessarabie
      à la Roumanie.
  - date: 1940-09-27
    texte: >
      Pacte tripartite entre l'Allemagne, l'Italie et le Japon.
  - date: 1941-06-22
    texte: >
      Opération Barbarossa : l'Allemagne et ses alliés envahissent l'URSS.
  - date: 1941-12-07
    texte: >
      Le Japon attaque Pearl Harbor et les possessions européennes d'Asie du Sud-Est ; les
      États-Unis entrent en guerre.
  - texte: >
      Ces dates sont celles de l'histoire réelle, données comme repères. Si les décisions des
      joueurs changent la situation, les événements peuvent arriver plus tôt, plus tard,
      autrement, ou pas du tout.

conseil_nations: [france, royaume-uni, allemagne, urss, pologne, etats-unis, italie, japon]
